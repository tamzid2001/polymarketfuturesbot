name: Kalshi KXBTC15M Hybrid Live

# The schedule only keeps a worker available.  The Python worker maintains the
# WebSocket and reacts to Kalshi's market timestamps at each boundary; it does
# not assume a cron invocation occurred at exactly a 15-minute open.
run-name: >-
  Kalshi KXBTC15M Hybrid —
  ${{ ((github.event_name == 'schedule' && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY != 'true') || (github.event_name == 'workflow_dispatch' && inputs.live_enabled && !inputs.dry_run && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY != 'true')) && 'LIVE' || format('DRY_RUN {0}', inputs.shadow_profile || 'sticky_stop_40') }}

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      live_enabled:
        description: "Permit real orders only when repository variable KALSHI_LIVE_ENABLED is also true."
        required: true
        type: boolean
        default: false
      dry_run:
        description: "Shadow/dry-run mode. Must be turned off as well as enabling live mode to submit orders."
        required: true
        type: boolean
        default: true
      shadow_profile:
        description: "Isolated sticky-direction shadow stop profile. Each profile has its own state, audit ledger, drawdown, and recovery cycle."
        required: true
        type: choice
        default: sticky_stop_40
        options:
          - sticky_stop_40
          - sticky_stop_30
          - sticky_stop_20
          - sticky_stop_10
      reconcile_only:
        description: "Authenticate and reconcile orders/positions only; never create an entry."
        required: true
        type: boolean
        default: false
      reset_state:
        description: "Replace idle local state only after authoritative exchange checks find no KXBTC15M risk."
        required: true
        type: boolean
        default: false
      entry_price:
        description: "Historical/replay reference price only. v10 enters through a fresh selected-side protected IOC; blank keeps the persisted reference."
        required: false
        type: string
        default: ""
      maker_price_offset:
        description: "Archived-maker telemetry compatibility only; it never changes v10 market-IOC execution."
        required: false
        type: string
        default: ""
      opening_price_discovery_seconds:
        description: "Archived maker telemetry compatibility only; v10 enters as soon as a fresh post-open executable book is available."
        required: false
        type: string
        default: ""
      opening_quote_max_observations:
        description: "Maximum complete top-of-book quote observations retained during the one-minute entry window. Blank keeps persisted configuration."
        required: false
        type: string
        default: ""
      stop_price:
        description: "Fixed executable stop floor. For shadow tests it must match the selected profile (40/30/20/10); blank selects that profile's fixed stop."
        required: false
        type: string
        default: ""
      stop_baseline_entry_price:
        description: "Baseline for the entry-adjusted stop. Only 0.50 is accepted: fills at/below it retain the 40c floor."
        required: false
        type: string
        default: ""
      recovery_multiplier:
        description: "Decimal recovery multiplier. Blank keeps persisted configuration."
        required: false
        type: string
        default: ""
      first_base_threshold:
        description: "First realized-profit base-scale threshold. Blank keeps persisted configuration."
        required: false
        type: string
        default: ""
      threshold_growth_multiplier:
        description: "Geometric threshold multiplier. Blank keeps persisted configuration."
        required: false
        type: string
        default: ""
      base_increment:
        description: "Permanent-base increment (0.25, 0.50, or 1.00). Blank keeps persisted configuration."
        required: false
        type: string
        default: ""
      max_position:
        description: "Maximum two-decimal contract quantity. Blank keeps persisted configuration."
        required: false
        type: string
        default: ""
      entry_timeout_seconds:
        description: "Maximum wait (1–60 seconds) for a fresh post-open executable book before the market is marked missed; v10 never posts a maker order."
        required: false
        type: string
        default: ""
      entry_lateness_seconds:
        description: "Maximum age after exchange open to submit a new entry. Blank keeps persisted configuration."
        required: false
        type: string
        default: ""
      market_discovery_interval_seconds:
        description: "Poll interval for bounded Kalshi previous/current/upcoming market discovery (0.25–10 seconds; default 1)."
        required: false
        type: string
        default: ""
      outcome_observation_seconds:
        description: "Ending-market direction window in seconds (5 default; 15 supported); only a >=99c bid inside this window qualifies."
        required: false
        type: string
        default: ""
      provisional_outcome_threshold:
        description: "Executable bid threshold used for immediate outcome inference, e.g. 0.99."
        required: false
        type: string
        default: ""
      starting_shadow_balance:
        description: "Initial isolated shadow-account balance. Blank keeps the persisted value."
        required: false
        type: string
        default: ""
      handoff_guard_seconds:
        description: "Boundary buffer for worker handoff; 60 keeps the first and final minute of each market with the current worker."
        required: false
        type: string
        default: ""
      run_seconds:
        description: "Minimum worker duration. At expiry the worker exits only in the quiet middle 13 minutes of a market."
        required: false
        type: string
        default: "18000"

# Serialized runs are intentional.  Cancel-in-progress is false because a new
# worker must never kill another worker mid-order; the next scheduled wakeup
# waits and begins by exchange reconciliation.
concurrency:
  group: kalshi-kxbtc15m-${{ inputs.shadow_profile || 'sticky_stop_40' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  trade:
    runs-on: ubuntu-latest
    environment: Kalshi
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_kalshi_settlement_trader.txt

      - name: Verify shared live strategy engine
        run: |
          set -euo pipefail
          python -m py_compile strategy_core.py live_state.py audit_ledger.py kalshi_live_trader.py optimizer.py
          PYTHONPATH=. python -m unittest -v \
            tests.test_strategy_core \
            tests.test_live_execution \
            tests.test_reconciliation \
            tests.test_recovery_sizing \
            tests.test_execution_path_model \
            tests.test_historical_replay

      - name: Assert canonical hybrid strategy contract
        run: |
          set -euo pipefail
          python -c 'from kalshi_live_trader import ACTIVE_CONFIG_SCHEMA_VERSION, ACTIVE_STRATEGY_VERSION, load_config; c = load_config(__import__("pathlib").Path("selected_live_strategy.json")); assert c["strategy_version"] == ACTIVE_STRATEGY_VERSION; assert c["config_schema_version"] == ACTIVE_CONFIG_SCHEMA_VERSION; assert c["entry_execution_mode"] == "immediate_market_ioc"; assert c["recovery_multiplier"] == "1.01"; assert c["max_recovery_exponent"] == 0; print("CANONICAL_HYBRID_STRATEGY_CONTRACT=OK | entry=market_ioc recovery=1.01 exponent_limit=disabled")'

      - name: Write Kalshi RSA private key
        env:
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KALSHI_PRIVATE_KEY" > kalshi_private_key.pem

      - name: Configure durable-state publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run KXBTC15M hybrid worker
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_PROD_API_KEY }}
          KALSHI_PEM_PATH: kalshi_private_key.pem
          KALSHI_DEMO: "false"
          KALSHI_LIVE_ENABLED: ${{ vars.KALSHI_LIVE_ENABLED || 'false' }}
          KALSHI_SHADOW_ONLY: ${{ vars.KALSHI_SHADOW_ONLY || 'true' }}
          KALSHI_CHECKPOINT_PUBLISH: "true"
          RUN_SECONDS: ${{ inputs.run_seconds || '18000' }}
          REQUESTED_LIVE: ${{ github.event_name == 'schedule' && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY != 'true' || github.event_name == 'workflow_dispatch' && inputs.live_enabled && !inputs.dry_run && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY != 'true' }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only || false }}
          RESET_STATE: ${{ inputs.reset_state || false }}
          SHADOW_PROFILE: ${{ inputs.shadow_profile || 'sticky_stop_40' }}
          ENTRY_PRICE: ${{ inputs.entry_price || '' }}
          MAKER_PRICE_OFFSET: ${{ inputs.maker_price_offset || '' }}
          OPENING_PRICE_DISCOVERY_SECONDS: ${{ inputs.opening_price_discovery_seconds || '' }}
          OPENING_QUOTE_MAX_OBSERVATIONS: ${{ inputs.opening_quote_max_observations || '' }}
          STOP_PRICE: ${{ inputs.stop_price || '' }}
          STOP_BASELINE_ENTRY_PRICE: ${{ inputs.stop_baseline_entry_price || '' }}
          RECOVERY_MULTIPLIER: ${{ inputs.recovery_multiplier || '' }}
          FIRST_BASE_THRESHOLD: ${{ inputs.first_base_threshold || '' }}
          THRESHOLD_GROWTH_MULTIPLIER: ${{ inputs.threshold_growth_multiplier || '' }}
          BASE_INCREMENT: ${{ inputs.base_increment || '' }}
          MAX_POSITION: ${{ inputs.max_position || '' }}
          ENTRY_TIMEOUT_SECONDS: ${{ inputs.entry_timeout_seconds || '' }}
          ENTRY_LATENESS_SECONDS: ${{ inputs.entry_lateness_seconds || '' }}
          MARKET_DISCOVERY_INTERVAL_SECONDS: ${{ inputs.market_discovery_interval_seconds || '' }}
          OUTCOME_OBSERVATION_SECONDS: ${{ inputs.outcome_observation_seconds || '' }}
          PROVISIONAL_OUTCOME_THRESHOLD: ${{ inputs.provisional_outcome_threshold || '' }}
          STARTING_SHADOW_BALANCE: ${{ inputs.starting_shadow_balance || '' }}
          HANDOFF_GUARD_SECONDS: ${{ inputs.handoff_guard_seconds || '' }}
        run: |
          set -euo pipefail
          # Shadow runs have a fully separate ledger/state.  Reconciliation
          # intentionally reads the live state but still cannot submit an
          # entry because the Python worker receives --reconcile-only.
          if [ "$REQUESTED_LIVE" = "true" ] || [ "$RECONCILE_ONLY" = "true" ]; then
            state_file=data/kalshi_live_market_ioc_v10_state.json
            audit_file=data/kalshi_live_market_ioc_v10_audit.jsonl
            profile_stop=""
          else
            case "$SHADOW_PROFILE" in
              sticky_stop_40) profile_stop=0.40 ;;
              sticky_stop_30) profile_stop=0.30 ;;
              sticky_stop_20) profile_stop=0.20 ;;
              sticky_stop_10) profile_stop=0.10 ;;
              *) echo "::error::Unknown shadow profile: $SHADOW_PROFILE"; exit 2 ;;
            esac
            if [ -n "$STOP_PRICE" ] && [ "$STOP_PRICE" != "$profile_stop" ]; then
              echo "::error::stop_price must equal the selected shadow profile stop ($profile_stop)."
              exit 2
            fi
            # v10 deliberately starts a separate namespace: it may not load
            # v8/v9 maker/entry-adjusted-stop state or resurrect a stale
            # synthetic cancellation record.
            state_file="data/kalshi_shadow_market_ioc_v10_${SHADOW_PROFILE}_state.json"
            audit_file="data/kalshi_shadow_market_ioc_v10_${SHADOW_PROFILE}_audit.jsonl"
          fi
          args=(--config selected_live_strategy.json
                --state-file "$state_file"
                --audit-ledger "$audit_file"
                --run-seconds "$RUN_SECONDS")
          if [ "$REQUESTED_LIVE" = "true" ] || [ "$RECONCILE_ONLY" = "true" ]; then
            args+=(--persist-config)
          else
            args+=(--shadow-profile "$SHADOW_PROFILE" --stop-price "$profile_stop")
          fi
          [ "$RECONCILE_ONLY" = "true" ] && args+=(--reconcile-only)
          [ "$RESET_STATE" = "true" ] && args+=(--reset-state)
          [ -z "$ENTRY_PRICE" ] || args+=(--entry-price "$ENTRY_PRICE")
          [ -z "$MAKER_PRICE_OFFSET" ] || args+=(--maker-price-offset "$MAKER_PRICE_OFFSET")
          [ -z "$OPENING_PRICE_DISCOVERY_SECONDS" ] || args+=(--opening-price-discovery-seconds "$OPENING_PRICE_DISCOVERY_SECONDS")
          [ -z "$OPENING_QUOTE_MAX_OBSERVATIONS" ] || args+=(--opening-quote-max-observations "$OPENING_QUOTE_MAX_OBSERVATIONS")
          [ -z "$STOP_PRICE" ] || args+=(--stop-price "$STOP_PRICE")
          [ -z "$STOP_BASELINE_ENTRY_PRICE" ] || args+=(--stop-baseline-entry-price "$STOP_BASELINE_ENTRY_PRICE")
          [ -z "$RECOVERY_MULTIPLIER" ] || args+=(--recovery-multiplier "$RECOVERY_MULTIPLIER")
          [ -z "$FIRST_BASE_THRESHOLD" ] || args+=(--first-base-threshold "$FIRST_BASE_THRESHOLD")
          [ -z "$THRESHOLD_GROWTH_MULTIPLIER" ] || args+=(--threshold-growth-multiplier "$THRESHOLD_GROWTH_MULTIPLIER")
          [ -z "$BASE_INCREMENT" ] || args+=(--base-increment "$BASE_INCREMENT")
          [ -z "$MAX_POSITION" ] || args+=(--max-position "$MAX_POSITION")
          [ -z "$ENTRY_TIMEOUT_SECONDS" ] || args+=(--entry-timeout-seconds "$ENTRY_TIMEOUT_SECONDS")
          [ -z "$ENTRY_LATENESS_SECONDS" ] || args+=(--entry-lateness-seconds "$ENTRY_LATENESS_SECONDS")
          [ -z "$MARKET_DISCOVERY_INTERVAL_SECONDS" ] || args+=(--market-discovery-interval-seconds "$MARKET_DISCOVERY_INTERVAL_SECONDS")
          [ -z "$OUTCOME_OBSERVATION_SECONDS" ] || args+=(--outcome-observation-seconds "$OUTCOME_OBSERVATION_SECONDS")
          [ -z "$PROVISIONAL_OUTCOME_THRESHOLD" ] || args+=(--provisional-outcome-threshold "$PROVISIONAL_OUTCOME_THRESHOLD")
          [ -z "$STARTING_SHADOW_BALANCE" ] || args+=(--starting-shadow-balance "$STARTING_SHADOW_BALANCE")
          [ -z "$HANDOFF_GUARD_SECONDS" ] || args+=(--handoff-guard-seconds "$HANDOFF_GUARD_SECONDS")
          if [ "$REQUESTED_LIVE" = "true" ]; then
            python kalshi_live_trader.py "${args[@]}" --live-enabled
          else
            python kalshi_live_trader.py "${args[@]}" --dry-run
          fi

      - name: Persist state, audit ledger, and chosen configuration
        if: always()
        run: |
          set -euo pipefail
          git add selected_live_strategy.json \
            data/kalshi_live_market_ioc_v10_state.json data/kalshi_live_market_ioc_v10_audit.jsonl \
            data/kalshi_shadow_strategy_state.json data/kalshi_shadow_strategy_audit.jsonl \
            data/kalshi_shadow_market_ioc_v10_*_state.json data/kalshi_shadow_market_ioc_v10_*_audit.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: checkpoint KXBTC15M hybrid state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "::error::Unable to publish durable live state after three retries."
          exit 1

      - name: Queue the next five-hour worker only after a safe handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_LIVE: ${{ github.event_name == 'schedule' && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY != 'true' || github.event_name == 'workflow_dispatch' && inputs.live_enabled && !inputs.dry_run && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY != 'true' }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only || false }}
          SHADOW_PROFILE: ${{ inputs.shadow_profile || 'sticky_stop_40' }}
        run: |
          set -euo pipefail
          [ "$RECONCILE_ONLY" = "true" ] && exit 0
          if [ "$REQUESTED_LIVE" = "true" ]; then
            state_file=data/kalshi_live_market_ioc_v10_state.json
          else
            state_file="data/kalshi_shadow_market_ioc_v10_${SHADOW_PROFILE}_state.json"
          fi
          ready="$(python -c 'import json, pathlib; p=pathlib.Path("'"$state_file"'"); print(str(bool(json.loads(p.read_text()).get("handoff", {}).get("ready"))).lower() if p.exists() else "false")')"
          if [ "$ready" != "true" ]; then
            echo "HANDOFF NOT QUEUED | no persisted safe-handoff marker."
            exit 0
          fi
          if [ "$REQUESTED_LIVE" = "true" ]; then
            gh workflow run kalshi_btc15m_average_down.yml --repo "$REPOSITORY" --ref main \
              -f live_enabled=true -f dry_run=false -f reconcile_only=false -f reset_state=false -f run_seconds=18000
          else
            gh workflow run kalshi_btc15m_average_down.yml --repo "$REPOSITORY" --ref main \
              -f live_enabled=false -f dry_run=true -f shadow_profile="$SHADOW_PROFILE" -f reconcile_only=false -f reset_state=false -f run_seconds=18000
          fi
          echo "SAFE HANDOFF QUEUED | next serialized five-hour worker requested."

      - name: Remove private key
        if: always()
        run: |
          rm -f kalshi_private_key.pem

      - name: Upload safe execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-kxbtc15m-hybrid-${{ github.run_id }}
          path: |
            selected_live_strategy.json
            data/kalshi_live_market_ioc_v10_state.json
            data/kalshi_live_market_ioc_v10_audit.jsonl
            data/kalshi_shadow_strategy_state.json
            data/kalshi_shadow_strategy_audit.jsonl
            data/kalshi_shadow_market_ioc_v10_*_state.json
            data/kalshi_shadow_market_ioc_v10_*_audit.jsonl
          if-no-files-found: warn
          retention-days: 30
