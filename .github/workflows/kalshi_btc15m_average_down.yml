name: Kalshi KXBTC15M Hybrid Live

# The watchdog only keeps a worker available. The Python worker maintains the
# WebSocket and reacts to Kalshi's market timestamps at each boundary; it does
# not assume a cron invocation occurred at exactly a 15-minute open.
run-name: >-
  Kalshi KXBTC15M Hybrid —
  ${{ inputs.reconcile_only && 'RECONCILE_ONLY delayed_53_57_stop_50' || (inputs.live_enabled && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY == 'false') && 'LIVE delayed_53_57_stop_50' || inputs.live_enabled && 'LIVE_REQUEST_BLOCKED delayed_53_57_stop_50' || 'DRY_RUN delayed_53_57_stop_50' }}

on:
  # The separately serialized watchdog owns the five-minute recovery
  # schedule. Keeping this long worker dispatch-only prevents a queue of
  # redundant scheduled five-hour jobs behind the singleton concurrency key.
  workflow_dispatch:
    inputs:
      live_enabled:
        description: "LIVE SWITCH: checked = real orders; unchecked = shadow. Requires KALSHI_LIVE_ENABLED=true and KALSHI_SHADOW_ONLY=false."
        required: true
        type: boolean
        default: false
      reconcile_only:
        description: "READ-ONLY CHECK: checked = reconciliation only, NO orders. Leave unchecked to trade."
        required: true
        type: boolean
        default: false
      initial_shares:
        description: "Initial two-decimal shares for a brand-new strategy state. Blank preserves the durable setting."
        required: false
        type: string
        default: ""
      scaling_multiplier:
        description: "Recovery and geometric threshold multiplier (default 2.50). Blank preserves the durable setting."
        required: false
        type: string
        default: ""
      max_share_cap:
        description: "Initial/fixed maximum shares. With cap-per-base enabled, 100 at base 1 becomes 200 at base 2. Blank preserves."
        required: false
        type: string
        default: ""
      max_cap_per_base_share:
        description: "Cap contracts per permanent base share. Default 100: base 1=>cap 100, base 2=>cap 200. Use 0 for fixed max_share_cap; blank preserves."
        required: false
        type: string
        default: ""
      profit_threshold:
        description: "Realized net profit required for the first permanent share increase. Blank preserves the durable setting."
        required: false
        type: string
        default: ""
      shares_added_after_profit_threshold:
        description: "Shares permanently added after each profit threshold. Blank preserves the last successfully checkpointed value."
        required: false
        type: string
        default: ""
      max_stop_loss_cents:
        description: "Hard stop 10-50c; trigger/maker stay 1c/2c higher. Blank preserves the saved stop (50c for a new configuration)."
        required: false
        type: string
        default: ""

# Serialized runs are intentional.  Cancel-in-progress is false because a new
# worker must never kill another worker mid-order; the next scheduled wakeup
# waits and begins by exchange reconciliation.
concurrency:
  group: kalshi-kxbtc15m-live
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  trade:
    runs-on: ubuntu-latest
    environment: Kalshi
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate explicit live switch (never silently fall back)
        id: live_gate
        env:
          LIVE_SWITCH: ${{ inputs.live_enabled || false }}
          READ_ONLY: ${{ inputs.reconcile_only || false }}
          LIVE_PERMISSION: ${{ vars.KALSHI_LIVE_ENABLED || 'false' }}
          SHADOW_ONLY: ${{ vars.KALSHI_SHADOW_ONLY || 'true' }}
        run: |
          set -euo pipefail
          if [ "$READ_ONLY" = "true" ]; then
            mode=RECONCILE_ONLY
          elif [ "$LIVE_SWITCH" = "true" ]; then
            if [ "$LIVE_PERMISSION" != "true" ] || [ "$SHADOW_ONLY" != "false" ]; then
              echo "::error::LIVE REQUEST BLOCKED: set repository KALSHI_LIVE_ENABLED=true and KALSHI_SHADOW_ONLY=false yourself. No worker started and no orders sent."
              exit 2
            fi
            mode=LIVE
          else
            mode=DRY_RUN
          fi
          echo "REQUESTED_MODE=$mode | source_sha=$(git rev-parse HEAD)"
          echo "KALSHI_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            echo "### Requested trading mode: $mode"
            echo 'Live switch must be checked AND both repository gates must permit live execution.'
            echo 'Reconciliation-only overrides the live switch and submits no orders.'
            echo 'Exchange authentication/reconciliation must still pass before the worker can trade.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_kalshi_settlement_trader.txt

      - name: Verify shared live strategy engine
        run: |
          set -euo pipefail
          python -m py_compile strategy_core.py live_state.py audit_ledger.py kalshi_live_trader.py optimizer.py kalshi_order_smoke_test.py kalshi_startup_order_check.py
          PYTHONPATH=. python -m unittest -v \
            tests.test_strategy_core \
            tests.test_position_cap \
            tests.test_live_execution \
            tests.test_live_stop_safety \
            tests.test_maker_hybrid_v11 \
            tests.test_delayed_band_v12 \
            tests.test_reconciliation \
            tests.test_exchange_shard_safety \
            tests.test_recovery_sizing \
            tests.test_execution_path_model \
            tests.test_historical_replay \
            tests.test_order_smoke_test \
            tests.test_startup_order_check \
            tests.test_workflow_configuration

      # Offline tests use the reviewed source defaults, never mutable operator
      # settings. Restore only allowlisted data/config after tests have passed.
      - name: Restore latest bounded runtime state
        id: runtime_restore
        run: |
          set -euo pipefail
          runtime_ref=runtime-state-kxbtc15m-delayed-v12
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$runtime_ref" >/dev/null
          runtime_ref_status=$?
          set -e
          if [ "$runtime_ref_status" -eq 0 ]; then
            git fetch --no-tags origin "refs/heads/$runtime_ref"
            restore_sha="$(git rev-parse FETCH_HEAD)"
            python3 live_checkpoint.py --restore-sha "$restore_sha" --runtime-ref "$runtime_ref"
            echo "RUNTIME_STATE_OWNER=kalshi-kxbtc15m-delayed-v12"
            echo "RUNTIME_STATE_RESTORED=$runtime_ref"
          elif [ "$runtime_ref_status" -eq 2 ]; then
            echo "RUNTIME_STATE_BOOTSTRAP=fresh_v12_namespace"
          else
            echo "::error::Unable to determine v12 runtime ref status; refusing unsafe fallback"
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$KALSHI_SOURCE_SHA"
          git diff --exit-code -- '*.py' '.github/workflows/' 'tests/' 'requirements_kalshi_settlement_trader.txt'

      - name: Assert canonical hybrid strategy contract
        run: |
          set -euo pipefail
          python -c 'from kalshi_live_trader import LIVE_STOP_SAFETY_CONTRACT_VERSION, POSITION_CAP_CONTRACT_VERSION; assert LIVE_STOP_SAFETY_CONTRACT_VERSION == 2; assert POSITION_CAP_CONTRACT_VERSION == 2; print("LIVE_STOP_SAFETY_CONTRACT=2 | trigger_latched_before_cancel=true cancel_404=order_fill_position_reconcile partial_ioc=residual_retry settlement_leak=incident"); print("POSITION_CAP_CONTRACT=2 | mode=base_linked_default")'
          python -c 'from decimal import Decimal; from kalshi_live_trader import ACTIVE_CONFIG_SCHEMA_VERSION, ACTIVE_STRATEGY_VERSION, BTC_TARGET_CAPTURE_CONTRACT_VERSION, DELAYED_ENTRY_LADDER_CONTRACT_VERSION, OPENING_PRICE_CAPTURE_CONTRACT_VERSION, load_config; c = load_config(__import__("pathlib").Path("selected_live_strategy.json")); assert c["strategy_version"] == ACTIVE_STRATEGY_VERSION; assert c["config_schema_version"] == ACTIVE_CONFIG_SCHEMA_VERSION == 12; assert OPENING_PRICE_CAPTURE_CONTRACT_VERSION == 3; assert BTC_TARGET_CAPTURE_CONTRACT_VERSION == 2; assert DELAYED_ENTRY_LADDER_CONTRACT_VERSION == 3; assert c["entry_execution_mode"] == "delayed_threshold_band_maker"; assert c["maker_order_time_in_force"] == "good_till_canceled"; assert c["entry_order_lifetime"] == "until_filled_or_market_close"; assert c["entry_timeout_seconds"] == 0; assert c["opening_quote_capture_seconds"] == 60; assert c["delayed_entry_start_seconds"] == 60; assert c["delayed_entry_threshold_cents"] == 53; assert c["delayed_entry_max_limit_cents"] == 57; assert c["entry_limit_offset_cents"] == 1; assert c["shadow_profile"] == "delayed_53_57_stop_50"; assert c["max_recovery_exponent"] == 0; assert c["durable_checkpoint_interval_seconds"] == 30.0; print("CANONICAL_DELAYED_BAND_STRATEGY_CONTRACT=OK | opening_ask_below=53c post_window=60s first_qualifying_ask>=53c entry=ask_minus_1c max_limit=57c maker_tif=GTC lifetime=until_fill_or_market_close hybrid=validated_config recovery=validated_config base=validated_config cap=permanent_base_linked checkpoint=v2_chunked_30s"); print("CONFIGURED_INITIAL_SHARE_CAP=" + c["max_position"]); print("CONFIGURED_CAP_PER_BASE_SHARE=" + str(c.get("max_position_per_base_share")))'

      - name: Write Kalshi RSA private key
        env:
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KALSHI_PRIVATE_KEY" > kalshi_private_key.pem

      - name: Verify live create and cancel path on the market shard
        if: ${{ !inputs.reconcile_only && inputs.live_enabled && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY == 'false' }}
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_PROD_API_KEY }}
          KALSHI_PEM_PATH: kalshi_private_key.pem
          KALSHI_DEMO: "false"
          KALSHI_LIVE_ENABLED: ${{ vars.KALSHI_LIVE_ENABLED || 'false' }}
          KALSHI_SHADOW_ONLY: ${{ vars.KALSHI_SHADOW_ONLY || 'true' }}
          KALSHI_STARTUP_ORDER_CHECK_ENABLED: "true"
          KALSHI_RUNTIME_STATE_REF: "runtime-state-kxbtc15m-delayed-v12"
        run: |
          set -euo pipefail
          # One 1.00-share/1c post-only probe is journaled before POST. The
          # strategy worker starts only after the exact create ACK, exact
          # cancel ACK, zero fills, zero remainder, and flat position are
          # independently reconciled on the market's authoritative shard.
          python kalshi_startup_order_check.py --execute \
            --worker-id "$GITHUB_RUN_ID" \
            --state-file data/kalshi_live_delayed_band_v12_state.json \
            --audit-ledger data/kalshi_live_delayed_band_v12_audit.jsonl \
            --config selected_live_strategy.json \
            --runtime-ref runtime-state-kxbtc15m-delayed-v12

      - name: Run KXBTC15M hybrid worker
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_PROD_API_KEY }}
          KALSHI_PEM_PATH: kalshi_private_key.pem
          KALSHI_DEMO: "false"
          KALSHI_LIVE_ENABLED: ${{ vars.KALSHI_LIVE_ENABLED || 'false' }}
          KALSHI_SHADOW_ONLY: ${{ vars.KALSHI_SHADOW_ONLY || 'true' }}
          KALSHI_STARTUP_ORDER_CHECK_ENABLED: "true"
          KALSHI_CHECKPOINT_PUBLISH: "true"
          KALSHI_RUNTIME_STATE_REF: "runtime-state-kxbtc15m-delayed-v12"
          RUN_SECONDS: "18000"
          REQUESTED_LIVE: ${{ !inputs.reconcile_only && inputs.live_enabled && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY == 'false' }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only || false }}
          SHADOW_PROFILE: "delayed_53_57_stop_50"
          INITIAL_SHARES: ${{ inputs.initial_shares || '' }}
          SCALING_MULTIPLIER: ${{ inputs.scaling_multiplier || '' }}
          MAX_SHARE_CAP: ${{ inputs.max_share_cap || '' }}
          MAX_CAP_PER_BASE_SHARE: ${{ inputs.max_cap_per_base_share || '' }}
          PROFIT_THRESHOLD: ${{ inputs.profit_threshold || '' }}
          SHARES_ADDED_AFTER_PROFIT_THRESHOLD: ${{ inputs.shares_added_after_profit_threshold || '' }}
          MAX_STOP_LOSS_CENTS: ${{ inputs.max_stop_loss_cents || '' }}
        run: |
          set -euo pipefail
          # Shadow runs have a fully separate ledger/state.  Reconciliation
          # intentionally reads the live state but still cannot submit an
          # entry because the Python worker receives --reconcile-only.
          if [ "$REQUESTED_LIVE" = "true" ] || [ "$RECONCILE_ONLY" = "true" ]; then
            state_file=data/kalshi_live_delayed_band_v12_state.json
            audit_file=data/kalshi_live_delayed_band_v12_audit.jsonl
          else
            case "$SHADOW_PROFILE" in
              delayed_53_57_stop_50) : ;;
              *) echo "::error::Unknown shadow profile: $SHADOW_PROFILE"; exit 2 ;;
            esac
            # v12 deliberately starts a new namespace. Older opening-entry and
            # comparison-stop evidence cannot become executable state.
            state_file="data/kalshi_shadow_delayed_band_v12_state.json"
            audit_file="data/kalshi_shadow_delayed_band_v12_audit.jsonl"
          fi
          args=(--config selected_live_strategy.json
                --state-file "$state_file"
                --audit-ledger "$audit_file"
                --persist-config
                --run-seconds "$RUN_SECONDS")
          if [ "$REQUESTED_LIVE" = "true" ] || [ "$RECONCILE_ONLY" = "true" ]; then
            args+=(--trading-mode live)
          else
            # Blank inputs must not reset a restored stop to 50c.
            args+=(--shadow-profile "$SHADOW_PROFILE" --trading-mode shadow)
          fi
          [ "$RECONCILE_ONLY" = "true" ] && args+=(--reconcile-only)
          [ -z "$INITIAL_SHARES" ] || args+=(--starting-base "$INITIAL_SHARES")
          [ -z "$MAX_SHARE_CAP" ] || args+=(--max-position "$MAX_SHARE_CAP")
          [ -z "$MAX_CAP_PER_BASE_SHARE" ] || args+=(--max-position-per-base-share "$MAX_CAP_PER_BASE_SHARE")
          if [ -n "$SCALING_MULTIPLIER" ]; then
            args+=(--recovery-multiplier "$SCALING_MULTIPLIER")
            args+=(--threshold-growth-multiplier "$SCALING_MULTIPLIER")
          fi
          [ -z "$PROFIT_THRESHOLD" ] || args+=(--first-base-threshold "$PROFIT_THRESHOLD")
          [ -z "$SHARES_ADDED_AFTER_PROFIT_THRESHOLD" ] || args+=(--base-increment "$SHARES_ADDED_AFTER_PROFIT_THRESHOLD")
          if [ -n "$MAX_STOP_LOSS_CENTS" ]; then
            [[ "$MAX_STOP_LOSS_CENTS" =~ ^[0-9]+$ ]] || {
              echo "::error::max_stop_loss_cents must be an integer from 10 through 50"; exit 2;
            }
            [ "$MAX_STOP_LOSS_CENTS" -ge 10 ] && [ "$MAX_STOP_LOSS_CENTS" -le 50 ] || {
              echo "::error::max_stop_loss_cents must be an integer from 10 through 50"; exit 2;
            }
            args+=(--stop-price "$(printf '0.%02d' "$MAX_STOP_LOSS_CENTS")")
            args+=(--hybrid-hard-stop-cents "$MAX_STOP_LOSS_CENTS")
            args+=(--hybrid-stop-trigger-cents "$((MAX_STOP_LOSS_CENTS + 1))")
            args+=(--hybrid-maker-exit-cents "$((MAX_STOP_LOSS_CENTS + 2))")
          fi
          if [ "$REQUESTED_LIVE" = "true" ]; then
            python kalshi_live_trader.py "${args[@]}" --live-enabled
          else
            python kalshi_live_trader.py "${args[@]}" --dry-run
          fi

      - name: Persist state, audit ledger, and chosen configuration
        if: always() && steps.live_gate.outcome == 'success' && steps.runtime_restore.outcome == 'success'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python live_checkpoint.py --reason end-of-run --runtime-ref runtime-state-kxbtc15m-delayed-v12 \
              selected_live_strategy.json \
              data/kalshi_live_delayed_band_v12_state.json \
              data/kalshi_live_delayed_band_v12_audit.jsonl \
              data/.kalshi_live_delayed_band_v12_startup_order_check/order-smoke-test.json \
              data/kalshi_shadow_delayed_band_v12_state.json \
              data/kalshi_shadow_delayed_band_v12_audit.jsonl; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Unable to publish bounded runtime state after three retries."
          exit 1

      - name: Queue the next five-hour worker only after a safe handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_LIVE: ${{ !inputs.reconcile_only && inputs.live_enabled && vars.KALSHI_LIVE_ENABLED == 'true' && vars.KALSHI_SHADOW_ONLY == 'false' }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only || false }}
          SHADOW_PROFILE: "delayed_53_57_stop_50"
        run: |
          set -euo pipefail
          [ "$RECONCILE_ONLY" = "true" ] && exit 0
          if [ "$REQUESTED_LIVE" = "true" ]; then
            state_file=data/kalshi_live_delayed_band_v12_state.json
          else
            state_file=data/kalshi_shadow_delayed_band_v12_state.json
          fi
          ready="$(python -c 'import json, pathlib; p=pathlib.Path("'"$state_file"'"); print(str(bool(json.loads(p.read_text()).get("handoff", {}).get("ready"))).lower() if p.exists() else "false")')"
          if [ "$ready" != "true" ]; then
            echo "HANDOFF NOT QUEUED | no persisted safe-handoff marker."
            exit 0
          fi
          if [ "$REQUESTED_LIVE" = "true" ]; then
            gh workflow run kalshi_btc15m_average_down.yml --repo "$REPOSITORY" --ref main \
              -f live_enabled=true -f reconcile_only=false
          else
            gh workflow run kalshi_btc15m_average_down.yml --repo "$REPOSITORY" --ref main \
              -f live_enabled=false -f reconcile_only=false
          fi
          echo "SAFE HANDOFF QUEUED | next serialized five-hour worker requested."

      - name: Remove private key
        if: always()
        run: |
          rm -f kalshi_private_key.pem

      - name: Upload safe execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-kxbtc15m-hybrid-${{ github.run_id }}
          path: |
            selected_live_strategy.json
            data/kalshi_live_delayed_band_v12_state.json
            data/kalshi_live_delayed_band_v12_audit.jsonl
            data/.kalshi_live_delayed_band_v12_startup_order_check/order-smoke-test.json
            data/kalshi_shadow_delayed_band_v12_state.json
            data/kalshi_shadow_delayed_band_v12_audit.jsonl
          if-no-files-found: warn
          retention-days: 30
