name: Transfer Kalshi secrets to Quantura API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    name: Copy encrypted environment values
    runs-on: ubuntu-latest
    environment: Kalshi
    timeout-minutes: 10
    env:
      KALSHI_PROD_API_KEY: ${{ secrets.KALSHI_PROD_API_KEY }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate secret availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KALSHI_PROD_API_KEY"
          test -n "$KALSHI_PRIVATE_KEY"
          test -n "$VERCEL_TOKEN"

      - name: Store Kalshi credentials in Quantura API
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KALSHI_PROD_API_KEY" |
            npx --yes vercel@59.5.0 env add KALSHI_PROD_API_KEY production,preview \
              --sensitive --force --yes \
              --project prj_ENRoWtXBjAYFP1p7JTnfDBTJE04V \
              --scope tamzid-ullahs-projects \
              --token "$VERCEL_TOKEN"
          printf '%s' "$KALSHI_PRIVATE_KEY" |
            npx --yes vercel@59.5.0 env add KALSHI_PRIVATE_KEY production,preview \
              --sensitive --force --yes \
              --project prj_ENRoWtXBjAYFP1p7JTnfDBTJE04V \
              --scope tamzid-ullahs-projects \
              --token "$VERCEL_TOKEN"

      - name: Confirm variable names only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.5.0 env ls production \
            --project prj_ENRoWtXBjAYFP1p7JTnfDBTJE04V \
            --scope tamzid-ullahs-projects \
            --token "$VERCEL_TOKEN" |
            grep -E 'KALSHI_(PROD_API_KEY|PRIVATE_KEY)'
