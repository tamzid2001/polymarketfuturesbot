name: Retired — Kalshi Equity-Regime Reconciliation

# Kept as a visible manual endpoint so an old bookmark cannot silently invoke
# the Prophet/equity-regime code path.  The hybrid KXBTC15M engine owns all
# current reconciliation; this workflow intentionally has no credentials.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This Prophet/equity-regime reconciliation workflow is retired."
          echo "Use Kalshi KXBTC15M Hybrid Live with reconcile_only=true instead."
