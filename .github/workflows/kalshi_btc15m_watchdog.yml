name: Kalshi KXBTC15M Hybrid Live Watchdog

# A recovery safety net for the hybrid trader. Normal five-hour workers only
# hand off in the middle 13 minutes of a KXBTC15M market. This workflow is a
# recovery path for a failed/missing worker; it never bypasses the live gate.
on:
  schedule:
    # Avoid minute zero, when GitHub Actions is most likely to delay or drop
    # scheduled jobs under load.
    - cron: "2-59/5 * * * *"
  workflow_run:
    workflows: ["Kalshi KXBTC15M Hybrid Live"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: kalshi-btc15m-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ensure-hybrid-runner:
    # A successful worker queues its own safe handoff. Failed workers and an
    # absent scheduled worker are recovered in their prior/safe mode.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch a mode-preserving recovery only when no worker owns the singleton
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
          KALSHI_LIVE_ENABLED: ${{ vars.KALSHI_LIVE_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          # A controlled restart cancels a live run before it queues its
          # reconciliation replacement. Give that replacement a brief window
          # to claim the singleton so a deliberate handoff never races a live
          # recovery dispatch.
          if [ "$TRIGGER" = "workflow_run" ]; then
            sleep 45
          fi
          runs="$(gh run list --repo "$REPOSITORY" \
            --workflow kalshi_btc15m_average_down.yml --limit 20 \
            --json databaseId,status,conclusion,updatedAt,displayTitle,event)"
          active="$(jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' <<<"$runs")"
          if [ "$active" -gt 0 ]; then
            echo "WATCHDOG HOLD | active_or_queued_hybrid_runs=$active; refusing overlap."
            exit 0
          fi

          latest="$(jq -c 'sort_by(.updatedAt // "") | last // {}' <<<"$runs")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$latest")"
          completed="$(jq -r '.updatedAt // ""' <<<"$latest")"
          if [ "$conclusion" = "success" ] && [ -n "$completed" ]; then
            completed_epoch="$(date -u -d "$completed" +%s)"
            now_epoch="$(date -u +%s)"
            age_seconds=$((now_epoch - completed_epoch))
            if [ "$age_seconds" -lt 600 ]; then
              echo "WATCHDOG WAIT | last successful runner completed ${age_seconds}s ago; allowing its normal handoff to appear."
              exit 0
            fi
          fi

          prior_live="$(jq -r '(.displayTitle // "") | endswith("LIVE")' <<<"$latest")"
          if [ "$KALSHI_LIVE_ENABLED" = "true" ] && { [ "$TRIGGER" = "schedule" ] || [ "$prior_live" = "true" ]; }; then
            gh workflow run kalshi_btc15m_average_down.yml --repo "$REPOSITORY" --ref main \
              -f live_enabled=true -f dry_run=false -f reconcile_only=false -f reset_state=false -f run_seconds=18000
            echo "WATCHDOG DISPATCHED | gated live hybrid recovery queued."
          else
            gh workflow run kalshi_btc15m_average_down.yml --repo "$REPOSITORY" --ref main \
              -f live_enabled=false -f dry_run=true -f reconcile_only=false -f reset_state=false -f run_seconds=18000
            echo "WATCHDOG DISPATCHED | shadow hybrid recovery queued."
          fi
