name: Kalshi KXBTC15M Hybrid Live Watchdog

# A recovery safety net for the settlement-only trader. The trader's normal
# 5h25m self-handoff remains primary. A failed *live* runner invokes this
# immediately; the offset five-minute schedule remains a fallback when a
# handoff disappears without creating a failure event.
on:
  schedule:
    # Avoid minute zero, when GitHub Actions is most likely to delay or drop
    # scheduled jobs under load.
    - cron: "2-59/5 * * * *"
  workflow_run:
    workflows: ["Kalshi KXBTC15M Hybrid Live"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: kalshi-btc15m-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ensure-live-runner:
    # A successful runner owns its normal handoff.  Failed runs need recovery,
    # but only if their title identifies them as LIVE (or they are a legacy
    # scheduled run, which is always live).  This prevents a completed dry-run
    # reconciliation from starting real trading on its own.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'success' &&
       (github.event.workflow_run.event == 'schedule' ||
        endsWith(github.event.workflow_run.display_title, 'LIVE')))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch a live recovery only when no trader owns the singleton
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A controlled restart cancels a live run before it queues its
          # reconciliation replacement. Give that replacement a brief window
          # to claim the singleton so a deliberate handoff never races a live
          # recovery dispatch.
          if [ "$TRIGGER" = "workflow_run" ]; then
            sleep 45
          fi
          runs="$(gh run list --repo "$REPOSITORY" \
            --workflow kalshi_btc15m_average_down.yml --limit 20 \
            --json databaseId,status,conclusion,updatedAt,displayTitle,event)"
          active="$(jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' <<<"$runs")"
          active_live="$(jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting") | select(((.displayTitle // "") | endswith("LIVE")) or .event == "schedule")] | length' <<<"$runs")"
          if [ "$active_live" -gt 0 ]; then
            echo "WATCHDOG OK | active_or_queued_live_runs=$active_live"
            exit 0
          fi
          if [ "$active" -gt 0 ]; then
            echo "WATCHDOG HOLD | active reconciliation or legacy runner count=$active; refusing to overlap it with live trading."
            exit 0
          fi

          latest="$(jq -c '[.[] | select(((.displayTitle // "") | endswith("LIVE")) or .event == "schedule")] | sort_by(.updatedAt // "") | last // {}' <<<"$runs")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$latest")"
          completed="$(jq -r '.updatedAt // ""' <<<"$latest")"
          if [ "$conclusion" = "success" ] && [ -n "$completed" ]; then
            completed_epoch="$(date -u -d "$completed" +%s)"
            now_epoch="$(date -u +%s)"
            age_seconds=$((now_epoch - completed_epoch))
            if [ "$age_seconds" -lt 600 ]; then
              echo "WATCHDOG WAIT | last successful runner completed ${age_seconds}s ago; allowing its normal handoff to appear."
              exit 0
            fi
          fi

          # The runner itself requires the repository live-enable variable as
          # a second gate; this dispatch cannot enable money movement alone.
          gh workflow run kalshi_btc15m_average_down.yml \
            --repo "$REPOSITORY" --ref main \
            -f live_enabled=true \
            -f dry_run=false \
            -f reconcile_only=false \
            -f reset_state=false
          echo "WATCHDOG DISPATCHED | hybrid live worker queued."
